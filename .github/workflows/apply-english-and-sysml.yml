name: apply-english-and-sysml
on:
  push:
    branches: [work/sysml-adapter-english]
    paths: ['.migration/**', '.github/workflows/apply-english-and-sysml.yml']
permissions:
  contents: write
  actions: read
jobs:
  apply-reviewed-source:
    if: github.ref == 'refs/heads/work/sysml-adapter-english'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve native validation evidence
        uses: actions/download-artifact@v4
        with:
          name: native-sysml-evidence
          run-id: 35839002637
          github-token: ${{ github.token }}
          path: build/source-evidence
      - name: Verify and apply reviewed changes
        run: python .migration/apply.py
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run regression tests and adapter
        run: |
          set -euo pipefail
          python -m pytest -q --junitxml=build/pytest.xml
          python -m safetycourse.sysml_adapter models/sysml/tk101.export.json --output-dir build/sysml
      - name: Execute all English notebooks with clean kernels
        run: python scripts/validate_notebooks.py
      - name: Commit verified source on the working branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/work/sysml-adapter-english | cut -f1)" = "$GITHUB_SHA"
          rm -rf .migration
          test -z "$(git diff --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement validated native SysML adapter and migrate course to English'
          git push origin HEAD:work/sysml-adapter-english
          git rev-parse HEAD > build/validated-source-commit.txt
      - name: Archive regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-sysml-validation
          path: |
            build/pytest.xml
            build/notebook_validation.json
            build/validated-source-commit.txt
            build/sysml/
          retention-days: 30
