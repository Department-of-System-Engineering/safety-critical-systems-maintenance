name: generate-notebook-course

on:
  push:
    branches: [main]
    paths:
      - 'tools/course_common.py'
      - 'tools/course_part*.py'
      - '.github/workflows/generate-course.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate structured teaching notebooks
        run: |
          python tools/course_part1.py
          python tools/course_part2.py
          python tools/course_part3.py
          python tools/course_part4.py

      - name: Commit generated notebooks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/*.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes.'
          else
            git commit -m 'Generate structured notebook-first course'
            git push
          fi
