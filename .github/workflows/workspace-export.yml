name: workspace-export
on:
  push:
    branches: [work/sysml-adapter-english]
    paths: [.github/workflows/workspace-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source files
        run: git archive --format=zip --output=workspace.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-workspace
          path: workspace.zip
          retention-days: 1
