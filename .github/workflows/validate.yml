name: validate
on:
  push:
    branches: [main, work/sysml-adapter-english]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and native-export regression tests
        run: |
          mkdir -p build
          python -m pytest -q --junitxml=build/pytest.xml
      - name: Run the native export to FTA demonstration
        run: python -m safetycourse.sysml_adapter models/sysml/tk101.export.json --output-dir build/sysml
      - name: Execute all teaching notebooks in clean kernels
        run: python scripts/validate_notebooks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            build/pytest.xml
            build/notebook_validation.json
            build/sysml/
          retention-days: 30
