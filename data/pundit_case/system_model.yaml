metadata:
  name: TK-101 flammable-liquid receiving and storage system
  representation: legacy hand-authored teaching exchange model (not a native SysML export)
  data_status: synthetic educational data
  project: 2020-1.2.3-EUREKA-2022-00021

components:
  - id: TK101
    type: tank
    function: store_flammable_liquid
    failure_modes:
      - id: TK101_LEAK
        name: Tank integrity failure
        mode: loss_of_integrity
        probability: 0.0005
  - id: P101
    type: pump
    function: feed_tank
    failure_modes:
      - id: P101_EXCESS
        name: Excessive feed flow
        mode: excess_flow
        probability: 0.03
  - id: LT101
    type: level_transmitter
    function: measure_level
    failure_modes:
      - id: LT101_LOW
        name: Level transmitter fouling or negative bias
        mode: failed_low
        probability: 0.02
  - id: LSHH101
    type: high_high_level_switch
    function: initiate_shutdown
    failure_modes:
      - id: LSHH101_FOD
        name: High-high switch failure on demand
        mode: fail_on_demand
        probability: 0.01
  - id: XV101
    type: shutdown_valve
    function: stop_inflow
    failure_modes:
      - id: XV101_FOD
        name: Shutdown valve fails to close on demand
        mode: fail_on_demand
        probability: 0.005

relationships:
  - from: P101
    to: TK101
    type: material_flow
  - from: LT101
    to: HMI
    type: measurement
  - from: LSHH101
    to: XV101
    type: trip_signal

basic_events:
  - id: HIGH_LEVEL_CHALLENGE
    name: High-level process challenge
    probability: 0.08
  - id: OPERATOR_MISS
    name: No timely operator response
    probability: 0.04
  - id: MAINT_OVERDUE
    name: Maintenance overdue
    probability: 0.12
  - id: IGNITION
    name: Effective ignition source present
    probability: 0.10
  - id: BUND_UNAVAILABLE
    name: Liquid containment ineffective
    probability: 0.02
  - id: FIRE_PROTECTION_FAIL
    name: Fire protection ineffective
    probability: 0.05

hazards:
  - id: OVERFLOW
    name: TK-101 overflow
    logic:
      gate: AND
      name: Overflow develops
      inputs:
        - event: HIGH_LEVEL_CHALLENGE
        - gate: AND
          name: No effective automatic or manual interruption
          inputs:
            - gate: OR
              name: Automatic shutdown fails
              inputs:
                - event: LSHH101_FOD
                - event: XV101_FOD
            - gate: OR
              name: Manual detection or intervention fails
              inputs:
                - event: LT101_LOW
                - event: OPERATOR_MISS
  - id: ESCALATED_FIRE
    name: Escalated fire following overflow
    logic:
      gate: AND
      inputs:
        - event: HIGH_LEVEL_CHALLENGE
        - gate: AND
          inputs:
            - gate: OR
              inputs:
                - event: LSHH101_FOD
                - event: XV101_FOD
            - gate: OR
              inputs:
                - event: LT101_LOW
                - event: OPERATOR_MISS
        - event: IGNITION
        - gate: OR
          inputs:
            - event: BUND_UNAVAILABLE
            - event: FIRE_PROTECTION_FAIL
