[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safetycourse"
version = "0.2.0"
description = "Teaching utilities for Safety-Critical Systems and Maintenance"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
  "nbformat>=5.9",
  "nbconvert>=7.16",
  "ipykernel>=6.29"
]

[project.scripts]
safetycourse-sysml = "safetycourse.sysml_adapter:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
